[project]
name = "treethink"
version = "0.1.0"
description = "TreeThink: A Modular Tree Search Library for Mathematical Reasoning with LLMs"
readme = "README.md"
authors = [
  { name="Burak S. Akbudak", email="buraksinaakbudak@gmail.com" },
  { name="Zeynel A.", email="zulusan23@ku.edu.tr" },
  { name="Can S. Erer", email="erer.can.work@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "lazy-loader>=0.5",
    "loguru",
    "mkinit>=1.2.0",
    "toml>=0.10.2",
    "typer>=0.12.0",
    "vllm>=0.8.5.post1",
]

[project.optional-dependencies]
lean = ["kimina-client"]
rocq = ["rocq-ml-toolbox", "pytanque"]
isabelle = ["isabelle-client"]
nl = ["sympy", "pylatexenc"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.25"]
full = ["treethink[lean,rocq,isabelle,nl,dev]"]

[project.scripts]
treethink = "treethink.cli.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
build = [
    "setuptools>=75.8.0",
]

[tool.uv]
default-groups = ["build"]

[tool.uv.sources]
kimina-client = { git = "https://github.com/project-numina/kimina-lean-server.git" }
rocq-ml-toolbox = { git = "https://github.com/LLM4Rocq/rocq-ml-toolbox.git" }
pytanque = { git = "https://github.com/llm4rocq/pytanque.git" }
